
name: BTCUSDT Daily Paper Trading

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paper-trading:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper trading bot
        run: python bot.py

      - name: Publish dashboard data
        run: |
          mkdir -p docs/data
          cp data/trades.csv docs/data/trades.csv

      - name: Save updated paper trading data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/
          if ! git diff --cached --quiet; then
            git commit -m "Update daily paper trading ledger"
            git push
          fi
